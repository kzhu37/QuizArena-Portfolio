<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="620" viewBox="0 0 1400 620" role="img" aria-labelledby="title desc">
  <title id="title">Quizler Arena architecture</title>
  <desc id="desc">React and TypeScript shell routes to Wordle, Hangman, and a Jeopardy wrapper. Wordle and Hangman use their own local banks. Jeopardy preserves a mature JavaScript runtime connected to a local question repository, board assembler, final selector, validator, usage history, and local storage.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1">
      <stop offset="0" stop-color="#0b0718"/>
      <stop offset="1" stop-color="#17102f"/>
    </linearGradient>
    <linearGradient id="top" x1="0" x2="1">
      <stop offset="0" stop-color="#7448e8"/>
      <stop offset="1" stop-color="#347fe0"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#8f85b7"/>
    </marker>
  </defs>
  <rect width="1400" height="620" rx="28" fill="url(#bg)"/>
  <text x="54" y="48" fill="#f5d56f" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="800" letter-spacing="2">PLATFORM ARCHITECTURE</text>

  <g font-family="Inter,Segoe UI,Arial,sans-serif" text-anchor="middle" font-weight="700">
    <rect x="430" y="78" width="540" height="72" rx="18" fill="url(#top)" stroke="#a59aff"/>
    <text x="700" y="122" fill="#fff" font-size="22">React + TypeScript platform shell</text>

    <g fill="#171126" stroke="#463b70">
      <rect x="92" y="205" width="280" height="78" rx="18"/>
      <rect x="560" y="205" width="280" height="78" rx="18"/>
      <rect x="1028" y="205" width="280" height="78" rx="18"/>
    </g>
    <text x="232" y="253" fill="#fff" font-size="20">Wordle</text>
    <text x="700" y="253" fill="#fff" font-size="20">Quizler Jeopardy wrapper</text>
    <text x="1168" y="253" fill="#fff" font-size="20">Hangman</text>

    <g fill="#12101f" stroke="#3d355e">
      <rect x="92" y="348" width="280" height="72" rx="16"/>
      <rect x="1028" y="348" width="280" height="72" rx="16"/>
      <rect x="544" y="330" width="312" height="72" rx="16"/>
    </g>
    <text x="232" y="392" fill="#ded7f2" font-size="18">Word banks + selection logic</text>
    <text x="1168" y="392" fill="#ded7f2" font-size="18">Puzzle banks + selection logic</text>
    <text x="700" y="374" fill="#ded7f2" font-size="18"><tspan x="700">Mature JavaScript</tspan><tspan x="700" dy="23">Jeopardy runtime</tspan></text>

    <rect x="544" y="452" width="312" height="70" rx="16" fill="#171126" stroke="#514875"/>
    <text x="700" y="495" fill="#fff" font-size="18">Local question repository</text>

    <g fill="#12101f" stroke="#3d355e">
      <rect x="300" y="548" width="230" height="48" rx="14"/>
      <rect x="585" y="548" width="230" height="48" rx="14"/>
      <rect x="870" y="548" width="230" height="48" rx="14"/>
    </g>
    <text x="415" y="578" fill="#ded7f2" font-size="16">Board assembler</text>
    <text x="700" y="578" fill="#ded7f2" font-size="16">Final selector</text>
    <text x="985" y="578" fill="#ded7f2" font-size="16">Question validator</text>
  </g>

  <g stroke="#8f85b7" stroke-width="3" fill="none" marker-end="url(#arrow)">
    <path d="M610 150 C520 175, 350 184, 232 199"/>
    <path d="M700 150 V199"/>
    <path d="M790 150 C880 175, 1050 184, 1168 199"/>
    <path d="M232 283 V342"/>
    <path d="M1168 283 V342"/>
    <path d="M700 283 V324"/>
    <path d="M700 402 V446"/>
    <path d="M650 522 C600 535, 500 540, 415 542"/>
    <path d="M700 522 V542"/>
    <path d="M750 522 C800 535, 900 540, 985 542"/>
  </g>

  <text x="60" y="470" fill="#a9a0c9" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15">Wordle and Hangman are native React modes.</text>
  <text x="960" y="470" fill="#a9a0c9" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15">Jeopardy is preserved behind the newer shell.</text>
</svg>