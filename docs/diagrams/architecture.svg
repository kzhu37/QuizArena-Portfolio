<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720" role="img" aria-labelledby="title desc">
  <title id="title">Quizler Arena architecture</title>
  <desc id="desc">React and TypeScript shell routes to Wordle, Hangman, and a preserved JavaScript Jeopardy runtime. Jeopardy connects a local question repository to board assembly, validation, Final selection, replayability history, save validation, and local storage.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1">
      <stop offset="0" stop-color="#0b0718"/>
      <stop offset="1" stop-color="#17102f"/>
    </linearGradient>
    <linearGradient id="top" x1="0" x2="1">
      <stop offset="0" stop-color="#7448e8"/>
      <stop offset="1" stop-color="#347fe0"/>
    </linearGradient>
    <linearGradient id="state" x1="0" x2="1">
      <stop offset="0" stop-color="#6243bd"/>
      <stop offset="1" stop-color="#315e9f"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#8f85b7"/>
    </marker>
    <marker id="stateArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#f5d56f"/>
    </marker>
  </defs>

  <rect width="1400" height="720" rx="28" fill="url(#bg)"/>
  <text x="54" y="48" fill="#f5d56f" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="800" letter-spacing="2">PLATFORM ARCHITECTURE</text>

  <g font-family="Inter,Segoe UI,Arial,sans-serif" text-anchor="middle" font-weight="700">
    <rect x="430" y="76" width="540" height="72" rx="18" fill="url(#top)" stroke="#a59aff"/>
    <text x="700" y="120" fill="#fff" font-size="22">React + TypeScript platform shell</text>

    <g fill="#171126" stroke="#463b70">
      <rect x="86" y="200" width="280" height="78" rx="18"/>
      <rect x="560" y="200" width="280" height="78" rx="18"/>
      <rect x="1034" y="200" width="280" height="78" rx="18"/>
    </g>
    <text x="226" y="248" fill="#fff" font-size="20">Wordle</text>
    <text x="700" y="248" fill="#fff" font-size="20">Quizler Jeopardy wrapper</text>
    <text x="1174" y="248" fill="#fff" font-size="20">Hangman</text>

    <g fill="#12101f" stroke="#3d355e">
      <rect x="86" y="330" width="280" height="72" rx="16"/>
      <rect x="1034" y="330" width="280" height="72" rx="16"/>
      <rect x="544" y="318" width="312" height="82" rx="16"/>
    </g>
    <text x="226" y="374" fill="#ded7f2" font-size="18">Word banks + selection logic</text>
    <text x="1174" y="374" fill="#ded7f2" font-size="18">Puzzle banks + selection logic</text>
    <text x="700" y="349" fill="#ded7f2" font-size="18"><tspan x="700">Mature JavaScript</tspan><tspan x="700" dy="23">Jeopardy runtime</tspan></text>

    <rect x="544" y="452" width="312" height="68" rx="16" fill="#171126" stroke="#514875"/>
    <text x="700" y="494" fill="#fff" font-size="18">Validated local question repository</text>

    <g fill="#12101f" stroke="#3d355e">
      <rect x="172" y="574" width="220" height="52" rx="14"/>
      <rect x="430" y="574" width="220" height="52" rx="14"/>
      <rect x="688" y="574" width="220" height="52" rx="14"/>
    </g>
    <text x="282" y="606" fill="#ded7f2" font-size="16">Board assembler</text>
    <text x="540" y="606" fill="#ded7f2" font-size="16">Question validator</text>
    <text x="798" y="606" fill="#ded7f2" font-size="16">Final selector</text>

    <rect x="958" y="452" width="356" height="174" rx="20" fill="#15122a" stroke="#6755a2"/>
    <text x="1136" y="482" fill="#f5d56f" font-size="15" letter-spacing="1.2">STATE + REPLAYABILITY</text>

    <rect x="982" y="510" width="136" height="50" rx="13" fill="url(#state)" stroke="#8c79c9"/>
    <rect x="1154" y="510" width="136" height="50" rx="13" fill="url(#state)" stroke="#8c79c9"/>
    <rect x="1068" y="584" width="136" height="34" rx="12" fill="#211a37" stroke="#5b4c84"/>
    <text x="1050" y="541" fill="#fff" font-size="15">UsageTracker</text>
    <text x="1222" y="533" fill="#fff" font-size="14"><tspan x="1222">GameState</tspan><tspan x="1222" dy="17">Adapter</tspan></text>
    <text x="1136" y="606" fill="#ded7f2" font-size="14">localStorage</text>
  </g>

  <g stroke="#8f85b7" stroke-width="3" fill="none" marker-end="url(#arrow)">
    <path d="M610 148 C520 174, 344 184, 226 194"/>
    <path d="M700 148 V194"/>
    <path d="M790 148 C880 174, 1056 184, 1174 194"/>
    <path d="M226 278 V324"/>
    <path d="M1174 278 V324"/>
    <path d="M700 278 V312"/>
    <path d="M700 400 V446"/>
    <path d="M640 520 C555 542, 410 552, 282 568"/>
    <path d="M700 520 C660 544, 600 552, 540 568"/>
    <path d="M760 520 C790 542, 795 552, 798 568"/>
  </g>

  <g stroke="#f5d56f" stroke-width="2.6" fill="none" marker-end="url(#stateArrow)">
    <path d="M958 535 C906 535, 876 530, 850 512"/>
    <path d="M1118 535 H1148"/>
    <path d="M1222 560 V578 C1222 596 1212 601 1210 601"/>
    <path d="M1068 601 C1018 600, 970 584, 918 568 C888 558, 862 544, 835 520"/>
  </g>

  <text x="60" y="676" fill="#a9a0c9" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15">Wordle and Hangman are native React modes.</text>
  <text x="517" y="676" fill="#a9a0c9" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15">Jeopardy stays behind the newer shell to preserve mature gameplay logic.</text>
  <text x="1018" y="676" fill="#d7cff0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15">History affects future board selection; saved state is validated before resume.</text>
</svg>
