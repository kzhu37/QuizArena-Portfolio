<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="300" viewBox="0 0 1400 300" role="img" aria-labelledby="title desc">
  <title id="title">Quizler Jeopardy board assembly flow</title>
  <desc id="desc">Validated repository, category ranking, six category search, clue backtracking, constraint validation, and final playable board.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1">
      <stop offset="0" stop-color="#0b0718"/>
      <stop offset="1" stop-color="#17102f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1">
      <stop offset="0" stop-color="#7c4dff"/>
      <stop offset="1" stop-color="#4ea3ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#8f85b7"/>
    </marker>
  </defs>
  <rect width="1400" height="300" rx="28" fill="url(#bg)"/>
  <text x="54" y="50" fill="#f5d56f" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="800" letter-spacing="2">BOARD ASSEMBLY</text>

  <g font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" text-anchor="middle" filter="url(#shadow)">
    <rect x="48" y="92" width="190" height="92" rx="18" fill="#171126" stroke="#463b70"/>
    <text x="143" y="126" fill="#ffffff" font-weight="700"><tspan x="143">Validated local</tspan><tspan x="143" dy="25">repository</tspan></text>

    <rect x="278" y="92" width="190" height="92" rx="18" fill="#171126" stroke="#463b70"/>
    <text x="373" y="126" fill="#ffffff" font-weight="700"><tspan x="373">Rank category</tspan><tspan x="373" dy="25">candidates</tspan></text>

    <rect x="508" y="92" width="205" height="92" rx="18" fill="#171126" stroke="#463b70"/>
    <text x="610.5" y="126" fill="#ffffff" font-weight="700"><tspan x="610.5">Search for six</tspan><tspan x="610.5" dy="25">categories</tspan></text>

    <rect x="753" y="92" width="205" height="92" rx="18" fill="#171126" stroke="#463b70"/>
    <text x="855.5" y="126" fill="#ffffff" font-weight="700"><tspan x="855.5">Backtrack through</tspan><tspan x="855.5" dy="25">clue values</tspan></text>

    <rect x="998" y="92" width="190" height="92" rx="18" fill="#171126" stroke="#463b70"/>
    <text x="1093" y="126" fill="#ffffff" font-weight="700"><tspan x="1093">Validate all</tspan><tspan x="1093" dy="25">constraints</tspan></text>

    <rect x="1228" y="92" width="132" height="92" rx="18" fill="url(#accent)" stroke="#a59aff"/>
    <text x="1294" y="126" fill="#ffffff" font-weight="800"><tspan x="1294">Playable</tspan><tspan x="1294" dy="25">round</tspan></text>
  </g>

  <g stroke="#8f85b7" stroke-width="3" fill="none" marker-end="url(#arrow)">
    <path d="M238 138 H272"/>
    <path d="M468 138 H502"/>
    <path d="M713 138 H747"/>
    <path d="M958 138 H992"/>
    <path d="M1188 138 H1222"/>
  </g>

  <path d="M1093 190 C1093 248, 610 248, 610 194" fill="none" stroke="#f5d56f" stroke-width="2.5" stroke-dasharray="7 7" marker-end="url(#arrow)"/>
  <text x="848" y="238" text-anchor="middle" fill="#d6ccef" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16">If a constraint fails, rollback and continue the search.</text>
</svg>