<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="500" viewBox="0 0 1400 500" role="img" aria-labelledby="title desc">
  <title id="title">Quizler Jeopardy nested board assembly search</title>
  <desc id="desc">Category candidates are ranked, each candidate must first solve a five-value clue path, shared uniqueness state is reserved, category search recurses, and either clue choices or entire categories can roll back when downstream constraints fail.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1">
      <stop offset="0" stop-color="#0b0718"/>
      <stop offset="1" stop-color="#17102f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1">
      <stop offset="0" stop-color="#7c4dff"/>
      <stop offset="1" stop-color="#4ea3ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#8f85b7"/>
    </marker>
    <marker id="rollbackArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#f5d56f"/>
    </marker>
  </defs>

  <rect width="1400" height="500" rx="28" fill="url(#bg)"/>
  <text x="54" y="48" fill="#f5d56f" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="800" letter-spacing="2">NESTED BOARD ASSEMBLY</text>

  <text x="54" y="86" fill="#a9a0c9" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="1.2">CATEGORY SEARCH</text>

  <g font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" text-anchor="middle" filter="url(#shadow)">
    <rect x="42" y="108" width="180" height="82" rx="18" fill="#171126" stroke="#463b70"/>
    <text x="132" y="140" fill="#ffffff" font-weight="700"><tspan x="132">Rank category</tspan><tspan x="132" dy="23">candidates</tspan></text>

    <rect x="262" y="108" width="180" height="82" rx="18" fill="#171126" stroke="#463b70"/>
    <text x="352" y="140" fill="#ffffff" font-weight="700"><tspan x="352">Choose one</tspan><tspan x="352" dy="23">candidate</tspan></text>

    <rect x="482" y="108" width="210" height="82" rx="18" fill="#171126" stroke="#463b70"/>
    <text x="587" y="140" fill="#ffffff" font-weight="700"><tspan x="587">Solve its five-value</tspan><tspan x="587" dy="23">clue path</tspan></text>

    <rect x="732" y="108" width="210" height="82" rx="18" fill="#171126" stroke="#463b70"/>
    <text x="837" y="140" fill="#ffffff" font-weight="700"><tspan x="837">Reserve shared</tspan><tspan x="837" dy="23">uniqueness state</tspan></text>

    <rect x="982" y="108" width="190" height="82" rx="18" fill="#171126" stroke="#463b70"/>
    <text x="1077" y="140" fill="#ffffff" font-weight="700"><tspan x="1077">Recurse to next</tspan><tspan x="1077" dy="23">category</tspan></text>

    <rect x="1212" y="108" width="148" height="82" rx="18" fill="url(#accent)" stroke="#a59aff"/>
    <text x="1286" y="140" fill="#ffffff" font-weight="800"><tspan x="1286">Playable</tspan><tspan x="1286" dy="23">round</tspan></text>
  </g>

  <g stroke="#8f85b7" stroke-width="3" fill="none" marker-end="url(#arrow)">
    <path d="M222 149 H256"/>
    <path d="M442 149 H476"/>
    <path d="M692 149 H726"/>
    <path d="M942 149 H976"/>
    <path d="M1172 149 H1206"/>
  </g>

  <path d="M1077 190 V225 C1077 247 1057 260 1035 260 H380 C358 260 352 247 352 225 V190" fill="none" stroke="#f5d56f" stroke-width="2.5" stroke-dasharray="7 7" marker-end="url(#rollbackArrow)"/>
  <text x="714" y="248" text-anchor="middle" fill="#f5d56f" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700">If later categories cannot complete the board, rollback the committed category and its reserved clues.</text>

  <rect x="42" y="292" width="1318" height="160" rx="22" fill="#12101f" stroke="#3f345e"/>
  <text x="72" y="325" fill="#a9a0c9" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="1.2">CLUE PATH SEARCH INSIDE EACH CATEGORY</text>

  <g font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" text-anchor="middle">
    <rect x="104" y="348" width="190" height="66" rx="16" fill="#171126" stroke="#463b70"/>
    <text x="199" y="375" fill="#ffffff" font-weight="700"><tspan x="199">Open next</tspan><tspan x="199" dy="21">value slot</tspan></text>

    <rect x="394" y="348" width="210" height="66" rx="16" fill="#171126" stroke="#463b70"/>
    <text x="499" y="375" fill="#ffffff" font-weight="700"><tspan x="499">Rank valid clue</tspan><tspan x="499" dy="21">candidates</tspan></text>

    <rect x="704" y="348" width="210" height="66" rx="16" fill="#171126" stroke="#463b70"/>
    <text x="809" y="375" fill="#ffffff" font-weight="700"><tspan x="809">Reserve clue, answer,</tspan><tspan x="809" dy="21">and fingerprint</tspan></text>

    <rect x="1014" y="348" width="242" height="66" rx="16" fill="#211a37" stroke="#6755a2"/>
    <text x="1135" y="375" fill="#ffffff" font-weight="700"><tspan x="1135">Advance only with</tspan><tspan x="1135" dy="21">higher difficulty</tspan></text>
  </g>

  <g stroke="#8f85b7" stroke-width="3" fill="none" marker-end="url(#arrow)">
    <path d="M294 381 H388"/>
    <path d="M604 381 H698"/>
    <path d="M914 381 H1008"/>
  </g>

  <path d="M1135 414 V432 H499 V414" fill="none" stroke="#f5d56f" stroke-width="2.3" stroke-dasharray="7 7" marker-end="url(#rollbackArrow)"/>
  <text x="817" y="446" text-anchor="middle" fill="#f5d56f" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14.5">If a later value has no legal clue, unwind the earlier clue choice and continue searching.</text>
</svg>
