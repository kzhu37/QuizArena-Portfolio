<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="260" viewBox="0 0 1400 260" role="img" aria-labelledby="title desc">
  <title id="title">Quizler Jeopardy content pipeline</title>
  <desc id="desc">Research packs and curated sources pass through source auditing, bank expansion, building, normalization, validation, and runtime selection.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1">
      <stop offset="0" stop-color="#0b0718"/>
      <stop offset="1" stop-color="#17102f"/>
    </linearGradient>
    <linearGradient id="final" x1="0" x2="1">
      <stop offset="0" stop-color="#6b46d9"/>
      <stop offset="1" stop-color="#2f86e6"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9186b9"/>
    </marker>
  </defs>
  <rect width="1400" height="260" rx="28" fill="url(#bg)"/>
  <text x="54" y="48" fill="#f5d56f" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="800" letter-spacing="2">CONTENT PIPELINE</text>

  <g font-family="Inter,Segoe UI,Arial,sans-serif" text-anchor="middle" font-size="17" font-weight="700">
    <g fill="#171126" stroke="#463b70">
      <rect x="42" y="88" width="176" height="92" rx="18"/>
      <rect x="242" y="88" width="154" height="92" rx="18"/>
      <rect x="420" y="88" width="166" height="92" rx="18"/>
      <rect x="610" y="88" width="148" height="92" rx="18"/>
      <rect x="782" y="88" width="156" height="92" rx="18"/>
      <rect x="962" y="88" width="170" height="92" rx="18"/>
    </g>
    <rect x="1156" y="88" width="202" height="92" rx="18" fill="url(#final)" stroke="#a59aff"/>

    <text x="130" y="121" fill="#fff"><tspan x="130">Research packs</tspan><tspan x="130" dy="23">and curated sources</tspan></text>
    <text x="319" y="133" fill="#fff">Source audit</text>
    <text x="503" y="121" fill="#fff"><tspan x="503">Expanded</tspan><tspan x="503" dy="23">source bank</tspan></text>
    <text x="684" y="133" fill="#fff">Build script</text>
    <text x="860" y="121" fill="#fff"><tspan x="860">Runtime bank</tspan><tspan x="860" dy="23">files</tspan></text>
    <text x="1047" y="121" fill="#fff"><tspan x="1047">Normalization</tspan><tspan x="1047" dy="23">and validation</tspan></text>
    <text x="1257" y="121" fill="#fff"><tspan x="1257">Board assembler</tspan><tspan x="1257" dy="23">and Final selector</tspan></text>
  </g>

  <g stroke="#9186b9" stroke-width="3" fill="none" marker-end="url(#arrow)">
    <path d="M218 134 H236"/>
    <path d="M396 134 H414"/>
    <path d="M586 134 H604"/>
    <path d="M758 134 H776"/>
    <path d="M938 134 H956"/>
    <path d="M1132 134 H1150"/>
  </g>

  <text x="700" y="221" text-anchor="middle" fill="#d6ccef" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16">Authored content is audited before build output reaches the runtime.</text>
</svg>