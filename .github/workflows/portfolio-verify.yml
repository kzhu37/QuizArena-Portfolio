name: Portfolio verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: portfolio-verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check portfolio writing
        run: npm run portfolio:lint

      - name: Verify platform
        shell: powershell
        run: npm run verify

      - name: Capture portfolio screenshots
        shell: powershell
        run: npm run portfolio:capture

      - name: Commit verified screenshots to portfolio branch
        if: github.event_name == 'pull_request'
        shell: powershell
        run: |
          $media = "docs/media"
          $required = @("lobby.png", "wordle.png", "jeopardy.png", "hangman.png")
          $missing = $required | Where-Object { -not (Test-Path (Join-Path $media $_)) }
          if ($missing.Count -eq 0) {
            Write-Host "Portfolio screenshots are already committed."
            exit 0
          }

          New-Item -ItemType Directory -Path $media -Force | Out-Null
          foreach ($name in $required) {
            Copy-Item (Join-Path "artifacts/portfolio-captures" $name) (Join-Path $media $name) -Force
          }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/media/*.png
          git commit -m "Add verified portfolio screenshots"
          git push origin HEAD:${{ github.head_ref }}

      - name: Upload portfolio screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-captures
          path: artifacts/portfolio-captures/*.png
          if-no-files-found: error
