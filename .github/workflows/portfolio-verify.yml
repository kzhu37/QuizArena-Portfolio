name: Portfolio verify

# Verifies both the portable production build and the deeper Windows-only tooling.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portfolio-verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check portfolio writing
        run: npm run portfolio:lint

      - name: Test core logic
        run: npm run test:core

      - name: Audit authored Jeopardy sources
        run: npm run bank:audit:sources

      - name: Build portable production application
        run: npm run build

      - name: Validate generated bank and runtime parity
        run: npm run bank:audit

  verify-and-capture:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check portfolio writing
        run: npm run portfolio:lint

      - name: Verify platform
        shell: powershell
        run: npm run verify

      - name: Capture portfolio screenshots
        shell: powershell
        run: npm run portfolio:capture

      - name: Upload portfolio screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-captures
          path: artifacts/portfolio-captures/*.png
          if-no-files-found: error
