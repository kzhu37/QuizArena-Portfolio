name: Portfolio verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portfolio-verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify platform
        shell: powershell
        run: npm run verify

      - name: Capture portfolio screenshots
        shell: powershell
        run: npm run portfolio:capture

      - name: Upload portfolio screenshots
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-captures
          path: artifacts/portfolio-captures/*.png
          if-no-files-found: error
