name: Production browser smoke

on:
  push:
    branches: [portfolio-polish-final]
    paths:
      - .github/workflows/production-browser-smoke.yml
      - tools/production-browser-smoke.cjs

permissions:
  contents: read

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install browser test runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Exercise updated production Quizler Arena
        env:
          QUIZLER_BASE_URL: https://quizler-arena-portfolio.vercel.app
        run: |
          sed -i 's/{ name: "Enter" }/{ name: "Enter", exact: true }/' tools/production-browser-smoke.cjs
          node tools/production-browser-smoke.cjs
