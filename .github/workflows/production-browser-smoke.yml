name: Production browser smoke

on:
  push:
    branches: [portfolio-polish-final]
    paths:
      - .github/workflows/production-browser-smoke.yml

permissions:
  contents: read

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install browser test runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Exercise production Quizler Arena
        env:
          QUIZLER_BASE_URL: https://quizler-arena-portfolio.vercel.app
        run: |
          cat > /tmp/quizler-production-smoke.cjs <<'EOF'
          const { chromium } = require('playwright');

          const baseUrl = process.env.QUIZLER_BASE_URL;
          const assert = (condition, message) => {
            if (!condition) throw new Error(message);
          };

          function evaluateWordle(answer, guess) {
            const result = Array.from({ length: guess.length }, () => 'absent');
            const remaining = new Map();
            for (let index = 0; index < answer.length; index += 1) {
              if (answer[index] === guess[index]) {
                result[index] = 'correct';
              } else {
                remaining.set(answer[index], (remaining.get(answer[index]) || 0) + 1);
              }
            }
            for (let index = 0; index < guess.length; index += 1) {
              if (result[index] === 'correct') continue;
              const available = remaining.get(guess[index]) || 0;
              if (available > 0) {
                result[index] = 'present';
                remaining.set(guess[index], available - 1);
              }
            }
            return result;
          }

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({ viewport: { width: 1440, height: 900 } });
            const consoleErrors = [];
            const pageErrors = [];
            const requestFailures = [];

            page.on('console', (message) => {
              if (message.type() === 'error') consoleErrors.push(message.text());
            });
            page.on('pageerror', (error) => pageErrors.push(String(error)));
            page.on('requestfailed', (request) => {
              const url = request.url();
              if (/fonts\.googleapis\.com|fonts\.gstatic\.com/.test(url)) return;
              requestFailures.push(`${request.failure()?.errorText || 'failed'} ${url}`);
            });

            await page.goto(`${baseUrl}/#/`, { waitUntil: 'networkidle' });
            await page.locator('.hub-stage').waitFor();
            assert((await page.locator('h1').first().textContent())?.includes('Quizler Arena'), 'Lobby did not render.');

            await page.getByRole('link', { name: 'Enter Wordle' }).click();
            await page.locator('.wordle-board').waitFor();
            assert(page.url().includes('#/wordle'), 'Wordle navigation failed.');

            const recentKey = 'quizarena_wordle_recent_answers_v2';
            const currentAnswer = await page.evaluate((key) => {
              const values = JSON.parse(localStorage.getItem(key) || '[]');
              return values[values.length - 1] || '';
            }, recentKey);
            assert(/^[a-z]{5}$/.test(currentAnswer), 'Wordle answer history was not initialized.');

            const repeatedCandidates = ['eerie', 'level', 'array', 'sassy', 'belle', 'refer', 'civic', 'mamma'];
            let acceptedGuess = null;
            for (const candidate of repeatedCandidates.filter((word) => word !== currentAnswer)) {
              await page.keyboard.type(candidate);
              await page.keyboard.press('Enter');
              await page.waitForTimeout(180);
              const status = (await page.locator('.wordle-status-copy').textContent()) || '';
              if (!status.includes('not in the active puzzle lexicon')) {
                acceptedGuess = candidate;
                break;
              }
              for (let index = 0; index < 5; index += 1) await page.keyboard.press('Backspace');
            }
            assert(acceptedGuess, 'Could not find an accepted repeated-letter Wordle guess.');

            const expectedStates = evaluateWordle(currentAnswer, acceptedGuess);
            const actualStates = await page.locator('.wordle-row').first().locator('.wordle-tile').evaluateAll((tiles) => {
              const states = ['correct', 'present', 'absent'];
              return tiles.map((tile) => states.find((state) => tile.classList.contains(`wordle-tile-${state}`)) || 'missing');
            });
            assert(JSON.stringify(actualStates) === JSON.stringify(expectedStates), `Duplicate-letter evaluation mismatch: ${actualStates} vs ${expectedStates}`);

            await page.getByRole('button', { name: 'New Puzzle' }).click();
            await page.waitForTimeout(120);
            const nextAnswer = await page.evaluate((key) => {
              const values = JSON.parse(localStorage.getItem(key) || '[]');
              return values[values.length - 1] || '';
            }, recentKey);
            assert(nextAnswer && nextAnswer !== currentAnswer, 'New Puzzle did not select a fresh Wordle answer.');

            await page.keyboard.type(nextAnswer);
            await page.keyboard.press('Enter');
            await page.getByText('Puzzle Solved').waitFor();
            const statsBeforeReload = await page.evaluate(() => localStorage.getItem('quizarena_wordle_stats_v1'));
            assert(statsBeforeReload, 'Wordle stats were not persisted to localStorage.');
            await page.reload({ waitUntil: 'networkidle' });
            await page.locator('.wordle-board').waitFor();
            const statsAfterReload = await page.evaluate(() => localStorage.getItem('quizarena_wordle_stats_v1'));
            assert(statsAfterReload === statsBeforeReload, 'Wordle localStorage did not survive refresh.');
            await page.getByRole('button', { name: 'Back To Lobby' }).first().click();
            await page.locator('.hub-stage').waitFor();

            await page.getByRole('link', { name: 'Enter Hangman' }).click();
            await page.locator('.hangman-answer-row').waitFor();
            assert(page.url().includes('#/hangman'), 'Hangman navigation failed.');
            const eButton = page.locator('.hangman-keyboard button', { hasText: /^E$/ });
            await eButton.click();
            await page.locator('.hangman-wrong-chips').first().getByText('E', { exact: true }).waitFor();
            assert(await eButton.isDisabled(), 'Hangman did not disable a used letter.');
            await page.getByRole('button', { name: 'New Puzzle' }).click();
            assert(!(await page.locator('.hangman-wrong-chips').first().getByText('E', { exact: true }).count()), 'Hangman New Puzzle did not reset used letters.');
            await page.getByRole('button', { name: 'Phrase' }).click();
            assert(await page.getByRole('button', { name: 'Phrase' }).getAttribute('class').then((value) => value?.includes('is-active')), 'Hangman phrase mode did not activate.');
            await page.getByRole('button', { name: 'Back To Lobby' }).first().click();
            await page.locator('.hub-stage').waitFor();

            await page.getByRole('link', { name: 'Enter Quizler Jeopardy' }).click();
            await page.locator('.legacy-jeopardy-frame').waitFor();
            assert(page.url().includes('#/jeopardy'), 'Jeopardy navigation failed.');
            assert(await page.getByRole('button', { name: 'Multiplayer Preview' }).count(), 'Multiplayer preview label is missing.');
            assert(await page.getByRole('button', { name: 'Demo Party Link' }).count(), 'Demo party-link label is missing.');

            const iframe = page.locator('.legacy-jeopardy-frame');
            const frame = await iframe.contentFrame();
            await frame.locator('#setupScreen').waitFor({ state: 'visible' });
            await frame.locator('#playerCount').selectOption('1');
            await frame.locator('#quickBtn').click();
            await frame.locator('.tile:not(.used)').first().waitFor();

            async function clearCurrentRound() {
              for (let clueIndex = 0; clueIndex < 30; clueIndex += 1) {
                const tile = frame.locator('.tile:not(.used)').first();
                await tile.click();
                await frame.locator('#overlay').waitFor({ state: 'visible' });
                const regular = frame.locator('#actionButtons button', { hasText: 'Regular' });
                if (await regular.count()) await regular.click();
                await frame.locator('#revealBtn').click();
                await frame.locator('#mAnswer').waitFor({ state: 'visible' });
                await frame.locator('#actionButtons button', { hasText: 'Correct (+)' }).click();
                await frame.locator('#overlay').waitFor({ state: 'hidden' });
              }
              assert(await frame.locator('.tile:not(.used)').count() === 0, 'Jeopardy round still has unused clues.');
            }

            await clearCurrentRound();
            assert(await frame.locator('#nextRoundBtn').isEnabled(), 'Round One did not enable progression.');
            await frame.locator('#nextRoundBtn').click();
            await frame.locator('.tile:not(.used)').first().waitFor();
            await clearCurrentRound();
            assert(await frame.locator('#nextRoundBtn').isEnabled(), 'Double Jeopardy did not enable progression.');
            await frame.locator('#nextRoundBtn').click();
            await frame.locator('#finalChoices .choice').first().waitFor();
            await frame.locator('#finalChoices .choice').first().click();
            await frame.locator('#wagerInput').waitFor();
            await frame.locator('#wagerInput').fill('100');
            await frame.locator('#saveWagerBtn').click();
            await frame.locator('#startAnswersBtn').waitFor();
            await frame.locator('#startAnswersBtn').click();
            await frame.locator('#finalAnswerText').waitFor();
            await frame.locator('#finalAnswerText').fill('test response');
            await frame.locator('#saveAnswerBtn').click();
            await frame.locator('#judgeList button[data-ok="1"]').first().waitFor();
            await frame.locator('#judgeList button[data-ok="1"]').first().click();
            await frame.locator('#finishFinalBtn').click();
            await frame.locator('#gameEndOverlay').waitFor({ state: 'visible' });

            await frame.locator('#saveBtn').click();
            const jeopardyStorageBefore = await page.evaluate(() => Object.keys(localStorage).filter((key) => /jeopardy/i.test(key)).sort());
            assert(jeopardyStorageBefore.length > 0, 'Jeopardy save keys were not present in production localStorage.');
            await page.reload({ waitUntil: 'networkidle' });
            await page.locator('.legacy-jeopardy-frame').waitFor();
            const reloadedFrame = await page.locator('.legacy-jeopardy-frame').contentFrame();
            await reloadedFrame.locator('#app').waitFor({ state: 'visible' });
            const jeopardyStorageAfter = await page.evaluate(() => Object.keys(localStorage).filter((key) => /jeopardy/i.test(key)).sort());
            assert(JSON.stringify(jeopardyStorageAfter) === JSON.stringify(jeopardyStorageBefore), 'Jeopardy localStorage keys changed unexpectedly after refresh.');

            await page.setViewportSize({ width: 390, height: 844 });
            await page.goto(`${baseUrl}/#/wordle`, { waitUntil: 'networkidle' });
            await page.locator('.wordle-board').waitFor();
            const overflow = await page.evaluate(() => document.documentElement.scrollWidth - document.documentElement.clientWidth);
            assert(overflow <= 2, `Mobile Wordle layout overflows horizontally by ${overflow}px.`);

            assert(pageErrors.length === 0, `Page errors: ${pageErrors.join('\n')}`);
            assert(consoleErrors.length === 0, `Console errors: ${consoleErrors.join('\n')}`);
            assert(requestFailures.length === 0, `Request failures: ${requestFailures.join('\n')}`);

            console.log('Production browser smoke passed for lobby, Wordle, Hangman, full Jeopardy flow, persistence, refresh, preview labels, and mobile layout.');
            await browser.close();
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          EOF
          node /tmp/quizler-production-smoke.cjs
