name: One-time long dash cleanup

on:
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event_name == 'workflow_dispatch' || github.event.issue.title == 'Run portfolio long dash cleanup'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Clean tracked UTF-8 text files
        shell: python
        run: |
          import pathlib
          import re
          import subprocess

          tracked = subprocess.check_output(['git', 'ls-files', '-z']).split(b'\0')
          codes = (0x2010, 0x2011, 0x2012, 0x2013, 0x2014, 0x2015)
          changed = []

          for raw_path in tracked:
              if not raw_path:
                  continue
              path = pathlib.Path(raw_path.decode('utf-8'))
              try:
                  data = path.read_bytes()
                  text = data.decode('utf-8')
              except (UnicodeDecodeError, OSError):
                  continue

              original = text
              lowered_parts = {part.lower() for part in path.parts}
              is_test_file = (
                  bool(lowered_parts & {'test', 'tests', '__tests__'})
                  or '.test.' in path.name.lower()
                  or '.spec.' in path.name.lower()
              )

              if is_test_file:
                  for code in codes:
                      text = text.replace(chr(code), f'\\u{code:04x}')
              else:
                  text = re.sub(r'\s*' + chr(0x2014) + r'\s*', ', ', text)
                  text = re.sub(r'(?<=\d)\s*' + chr(0x2013) + r'\s*(?=\d)', '-', text)
                  text = re.sub(r'\s+' + chr(0x2013) + r'\s+', ', ', text)
                  text = text.replace(chr(0x2013), '-')
                  text = text.replace(chr(0x2012), '-')
                  text = text.replace(chr(0x2015), '-')
                  text = text.replace(chr(0x2010), '-')
                  text = text.replace(chr(0x2011), '-')

              if text != original:
                  path.write_bytes(text.encode('utf-8'))
                  changed.append(str(path))

          print(f'Changed {len(changed)} tracked text file(s).')
          for item in changed:
              print(item)

          unresolved = []
          for raw_path in tracked:
              if not raw_path:
                  continue
              path = pathlib.Path(raw_path.decode('utf-8'))
              try:
                  text = path.read_bytes().decode('utf-8')
              except (UnicodeDecodeError, OSError):
                  continue
              hits = sum(text.count(chr(code)) for code in codes)
              if hits:
                  unresolved.append((str(path), hits))

          if unresolved:
              for item, count in unresolved:
                  print(f'Unresolved Unicode dash characters: {item}: {count}')
              raise SystemExit(1)

      - name: Commit cleanup
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No tracked text changes were needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Remove typographic long dashes'
          git push
