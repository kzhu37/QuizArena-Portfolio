name: Portfolio dash cleanup

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.head_commit.message != 'Remove long dashes across portfolio content'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Remove long dash punctuation from tracked text
        shell: python
        run: |
          import pathlib
          import subprocess

          workflow_path = pathlib.Path('.github/workflows/portfolio-dash-cleanup.yml')
          trigger_path = pathlib.Path('.github/dash-cleanup-trigger')
          tracked = subprocess.check_output(['git', 'ls-files', '-z']).split(b'\0')
          literal_codes = (
              0x2010, 0x2011, 0x2012, 0x2013, 0x2014, 0x2015,
              0x23AF, 0x2500, 0x2501, 0x2504, 0x2505, 0x2508, 0x2509,
              0x254C, 0x254D, 0x2550, 0x2E3A, 0x2E3B, 0xFE58, 0xFE63, 0xFF0D,
          )
          compact_codes = {
              0x2010, 0x2011, 0x2012, 0x2013, 0x23AF,
              0x2500, 0x2501, 0x2504, 0x2505, 0x2508, 0x2509, 0x254C, 0x254D, 0x2550,
              0xFE63, 0xFF0D,
          }
          html_forms = {
              '&ndash;': '-', '&mdash;': ' - ',
              '&#8211;': '-', '&#8212;': ' - ',
              '&#x2013;': '-', '&#x2014;': ' - ',
              '&#X2013;': '-', '&#X2014;': ' - ',
          }
          code_exts = {
              '.c', '.cc', '.cpp', '.cs', '.css', '.go', '.h', '.hpp', '.html',
              '.java', '.js', '.jsx', '.mjs', '.cjs', '.php', '.ps1', '.py', '.rb',
              '.rs', '.sh', '.ts', '.tsx', '.vue', '.svelte',
          }

          def is_test_path(path):
              lowered = [part.lower() for part in path.parts]
              name = path.name.lower()
              return (
                  any(part in {'test', 'tests', '__tests__'} for part in lowered)
                  or '.test.' in name
                  or '.spec.' in name
              )

          def preserve_escape_line(path, line):
              lower = line.lower()
              if is_test_path(path):
                  return True
              if path.suffix.lower() in code_exts:
                  if '/[' in line and any(chr(code) in line for code in literal_codes):
                      return True
                  if 'regexp(' in lower and any(chr(code) in line for code in literal_codes):
                      return True
                  if any(key in lower for key in (
                      'forbiddendash', 'dashpattern', 'dash_pattern',
                      'normalize', 'normalise', 'sanitiz', 'canonicaliz',
                  )):
                      return True
              return False

          def replace_literal_with_escape(line):
              for code in literal_codes:
                  line = line.replace(chr(code), f'\\u{code:04x}')
              return line

          def replace_visible_escapes(line):
              for code in literal_codes:
                  for token in (f'\\u{code:04x}', f'\\u{code:04X}'):
                      line = line.replace(token, '-' if code in compact_codes else ' - ')
              return line

          changed = []
          for raw in tracked:
              if not raw:
                  continue
              path = pathlib.Path(raw.decode('utf-8'))
              if path in {workflow_path, trigger_path}:
                  continue
              try:
                  text = path.read_bytes().decode('utf-8')
              except (UnicodeDecodeError, OSError):
                  continue

              original = text
              out = []
              for line in text.splitlines(keepends=True):
                  if path.suffix.lower() in {'.yml', '.yaml'} and 'grep ' in line and any(chr(code) in line for code in literal_codes):
                      line = line.replace('grep -RInE', 'grep -RInP').replace('grep -InE', 'grep -InP')
                      for code in literal_codes:
                          line = line.replace(chr(code), f'\\x{{{code:04x}}}')
                  elif preserve_escape_line(path, line):
                      line = replace_literal_with_escape(line)
                  else:
                      line = replace_visible_escapes(line)
                      for source, target in html_forms.items():
                          line = line.replace(source, target)
                      for code in literal_codes:
                          line = line.replace(chr(code), '-' if code in compact_codes else ' - ')
                  out.append(line)

              text = ''.join(out)
              if text != original:
                  path.write_bytes(text.encode('utf-8'))
                  changed.append(str(path))

          print(f'Changed {len(changed)} tracked UTF-8 text file(s).')
          for item in changed:
              print(item)

          unresolved = []
          for raw in tracked:
              if not raw:
                  continue
              path = pathlib.Path(raw.decode('utf-8'))
              if path in {workflow_path, trigger_path}:
                  continue
              try:
                  text = path.read_bytes().decode('utf-8')
              except (UnicodeDecodeError, OSError):
                  continue

              for code in literal_codes:
                  if chr(code) in text:
                      unresolved.append(f'{path}: literal U+{code:04X}')
              lowered = text.lower()
              for token in ('&ndash;', '&mdash;', '&#8211;', '&#8212;', '&#x2013;', '&#x2014;'):
                  if token in lowered:
                      unresolved.append(f'{path}: encoded {token}')

              for line_no, line in enumerate(text.splitlines(), 1):
                  for code in literal_codes:
                      tokens = (f'\\u{code:04x}', f'\\u{code:04X}')
                      if any(token in line for token in tokens) and not preserve_escape_line(path, line):
                          unresolved.append(f'{path}:{line_no}: renderable escaped U+{code:04X}')

          if unresolved:
              print('Unresolved long dash representations:')
              for item in unresolved:
                  print(item)
              raise SystemExit(1)

      - name: Validate diff
        shell: bash
        run: git diff --check

      - name: Commit cleanup against latest main
        shell: bash
        run: |
          rm -f .github/workflows/portfolio-dash-cleanup.yml .github/dash-cleanup-trigger
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Remove long dashes across portfolio content'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
