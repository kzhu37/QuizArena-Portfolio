name: Fix source generator references

on:
  push:
    paths:
      - .github/workflows/fix-source-generator-reference.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update validator references
        shell: python
        run: |
          from pathlib import Path

          path = Path("tools/validate-jeopardy-bank.cjs")
          text = path.read_text(encoding="utf-8")
          replacements = [
              ("generate-jeopardy-classroom-bank.cjs", "generate-jeopardy-source-bank.cjs"),
              ("regenerate the classroom bank", "regenerate the source bank"),
              ("rerun the classroom generator", "rerun the source bank generator"),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f"Expected text not found: {old}")
              text = text.replace(old, new)
          path.write_text(text, encoding="utf-8")
      - name: Commit validator fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/validate-jeopardy-bank.cjs
          git commit -m "Update source bank validator references"
          git push
