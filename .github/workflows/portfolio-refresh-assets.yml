name: Portfolio refresh assets

on:
  push:
    branches: [portfolio-admissions-final-pass]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install current dependencies
        run: npm ci

      - name: Upgrade React Router
        run: npm install --save-exact --package-lock-only react-router-dom@7.18.2

      - name: Install upgraded dependency graph
        run: npm ci

      - name: Audit production dependencies
        id: audit
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=moderate

      - name: Verify build with upgraded router
        run: |
          npm run test:core
          npm run build
          npm run bank:audit
          npm run wordgames:validate
          npm run portfolio:lint

      - name: Record audit outcome
        run: |
          echo "audit_outcome=${{ steps.audit.outcome }}" > portfolio-refresh-status.txt

      - name: Upload refreshed dependency files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-refresh
          path: |
            package.json
            package-lock.json
            portfolio-refresh-status.txt
          if-no-files-found: warn

  capture-current:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build current application
        run: npm run build

      - name: Capture current portfolio screenshots
        shell: powershell
        run: npm run portfolio:capture

      - name: Upload current screenshots
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-current-captures
          path: artifacts/portfolio-captures/*.png
          if-no-files-found: error
