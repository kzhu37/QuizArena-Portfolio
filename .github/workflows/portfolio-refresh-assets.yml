name: Portfolio refresh assets

on:
  push:
    branches: [portfolio-admissions-final-pass]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install current dependencies
        run: npm ci

      - name: Upgrade React Router
        run: npm install --save-exact --package-lock-only react-router-dom@7.18.2

      - name: Install upgraded dependency graph
        run: npm ci

      - name: Audit production dependencies
        id: audit
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=moderate

      - name: Verify build with upgraded router
        run: |
          npm run test:core
          npm run build
          npm run bank:audit
          npm run wordgames:validate
          npm run portfolio:lint

      - name: Convert README captures to WebP
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          media = Path('docs/media')
          for name in ['lobby', 'jeopardy', 'wordle', 'hangman']:
              source = media / f'{name}.png'
              target = media / f'{name}.webp'
              with Image.open(source) as image:
                  image.save(target, 'WEBP', quality=84, method=6)
                  print(f'{source}: {source.stat().st_size} -> {target.stat().st_size}')
          PY

      - name: Record audit outcome
        run: |
          echo "audit_outcome=${{ steps.audit.outcome }}" > portfolio-refresh-status.txt

      - name: Upload refreshed files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-refresh
          path: |
            package.json
            package-lock.json
            docs/media/lobby.webp
            docs/media/jeopardy.webp
            docs/media/wordle.webp
            docs/media/hangman.webp
            portfolio-refresh-status.txt
          if-no-files-found: warn
