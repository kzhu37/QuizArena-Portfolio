name: Prepare portfolio media

on:
  push:
    branches: [portfolio-polish-final]
    paths:
      - .github/workflows/prepare-portfolio-media.yml

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Check out portfolio branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: portfolio-polish-final

      - name: Download supplied gameplay captures
        shell: bash
        run: |
          set -euo pipefail
          curl -fL 'https://media.canva.com/v2/image-resize/format:PNG/height:1080/quality:100/uri:ifs%3A%2F%2FM%2Fe9399a82-918b-4166-866e-46cd56ce2d68/watermark:F/width:1920?csig=AAAAAAAAAAAAAAAAAAAAAMch3goZhHiB7C7iFaQX4zHkjfHfCVQXYfbql62469Fd&exp=1787709976&osig=AAAAAAAAAAAAAAAAAAAAABK79M0FPmfTBXF1b8tcBW8rab7ZJ5B2uMxmOR62rUk_&signer=media-rpc' -o /tmp/jeopardy.png
          curl -fL 'https://media.canva.com/v2/image-resize/format:PNG/height:944/quality:100/uri:ifs%3A%2F%2FM%2F1ac61a4e-5651-4199-9493-c118d1b95f5e/watermark:F/width:1916?csig=AAAAAAAAAAAAAAAAAAAAAH6XWSJD5dC1PdR-6rQKFN5GAxmHleYArcVJBucqOU7d&exp=1787710915&osig=AAAAAAAAAAAAAAAAAAAAADmKTkr0uZla7hwIVg5wqgrFH6MDQFiI-2N_fN2Ho7JL&signer=media-rpc' -o /tmp/wordle.png
          curl -fL 'https://media.canva.com/v2/image-resize/format:PNG/height:1080/quality:100/uri:ifs%3A%2F%2FM%2F74c12125-8b3a-402a-bd74-b5f11eef2272/watermark:F/width:1920?csig=AAAAAAAAAAAAAAAAAAAAAKy8d8u5uCmDGMXBD0_ktJ19O4amZY3skKH8jwv7RpRw&exp=1787707670&osig=AAAAAAAAAAAAAAAAAAAAAE0ioxK384wtWqmAtLY3g9q49rNsVmBAP_UkVL80jf6Z&signer=media-rpc' -o /tmp/hangman.png

      - name: Crop and optimize documentation captures
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          sources = {
              'lobby': Path('docs/media/lobby.png'),
              'wordle': Path('/tmp/wordle.png'),
              'hangman': Path('/tmp/hangman.png'),
              'jeopardy': Path('/tmp/jeopardy.png'),
          }

          for name, path in sources.items():
              with Image.open(path).convert('RGB') as image:
                  if name != 'lobby':
                      image = image.crop((0, 1, image.width, image.height))
                  output = Path('docs/media') / f'{name}.webp'
                  image.save(output, 'WEBP', quality=90, method=6)
                  print(name, image.size, output.stat().st_size)
          PY

      - name: Remove superseded screenshot copies
        shell: bash
        run: |
          set -euo pipefail
          git rm -f docs/media/lobby.png docs/media/wordle.png docs/media/hangman.png docs/media/jeopardy.png
          git rm -f docs/media/wordle-corrected.webp docs/media/hangman-corrected.webp docs/media/jeopardy-corrected.webp

      - name: Commit final media and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/prepare-portfolio-media.yml
          git add docs/media/lobby.webp docs/media/wordle.webp docs/media/hangman.webp docs/media/jeopardy.webp
          git commit -m 'Optimize final portfolio gameplay captures'
          git push origin HEAD:portfolio-polish-final
