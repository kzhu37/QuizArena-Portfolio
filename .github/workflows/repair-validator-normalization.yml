name: Repair validator normalization

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair remaining malformed text normalizer
        run: |
          python - <<'PY'
          from pathlib import Path
          targets = list(Path('tools').glob('*.cjs'))
          replacements = {
              ".replace(/[- - ]/g, '-')": ".replace(/[\\u2010-\\u2015\\u2212]/g, '-')",
              ".replace(/[-- - ]/g, '-')": ".replace(/[\\u2010-\\u2015\\u2212]/g, '-')",
          }
          repaired = 0
          for path in targets:
              text = path.read_text(encoding='utf-8')
              original = text
              for old, new in replacements.items():
                  repaired += text.count(old)
                  text = text.replace(old, new)
              if text != original:
                  path.write_text(text, encoding='utf-8')
                  print(f'repaired {path}')
          if repaired == 0:
              raise SystemExit('No malformed normalization pattern was found')
          print(f'repaired {repaired} malformed normalization pattern(s)')
          PY
      - name: Commit validator repair
        run: |
          git config user.name "Kevin Zhu"
          git config user.email "126812866+kzhu37@users.noreply.github.com"
          git add tools
          git commit -m "Repair remaining text normalization"
          git push
